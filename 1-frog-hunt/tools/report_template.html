<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>100 Hidden Frogs × Jev — решения</title>
<style>
  :root { --bg:#14161a; --card:#1d2126; --line:#2c333b; --ink:#e8ecf1; --dim:#93a1b1;
          --green:#00be5a; --yellow:#ebbe28; --magenta:#dc3cc8; --orange:#f0641e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:14px 20px 10px; border-bottom:1px solid #2a2f36; display:flex;
           align-items:baseline; gap:18px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; letter-spacing:.3px; }
  header .meta { color:var(--dim); font-size:12.5px; }
  header .meta b { color:var(--ink); font-weight:600; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 350px; grid-template-rows:minmax(0,1fr);
         gap:16px; padding:12px 20px 6px; height:calc(100vh - 208px); min-height:480px; }
  #viewer { background:#0b0c0e; border:1px solid #262b31; border-radius:10px; overflow:hidden;
            display:flex; align-items:center; justify-content:center; height:100%; min-height:0; }
  #shot { width:100%; height:100%; object-fit:contain; display:block; }
  aside { background:var(--card); border:1px solid #262b31; border-radius:10px; padding:14px;
          overflow:auto; }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
             margin:14px 0 8px; }
  aside h2:first-of-type { margin-top:0; }
  .action { font-size:19px; font-weight:700; margin-bottom:10px; }
  .action.start { color:var(--magenta); } .action.click { color:var(--green); }
  .action.scroll { color:var(--orange); }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px; margin:0; }
  .kv dt { color:var(--dim); } .kv dd { margin:0; font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:4px 6px; border-bottom:1px solid #262b31; }
  th { color:var(--dim); font-weight:500; }
  tr.best td { color:var(--green); }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--dim); margin-bottom:10px; }
  .legend i { display:inline-block; width:10px; height:10px; margin-right:5px; border-radius:2px; }
  nav { display:flex; gap:8px; overflow-x:auto; padding:10px 20px 16px; }
  .chip { flex:0 0 auto; min-width:132px; background:var(--card); border:1px solid #262b31;
          border-radius:8px; padding:8px 10px; cursor:pointer; color:var(--ink); text-align:left; }
  .chip:hover { border-color:#3b434d; }
  .chip.active { border-color:#6d7885; background:#232a31; }
  .chip .top { display:flex; justify-content:space-between; align-items:center; gap:8px;
               font-size:12px; color:var(--dim); }
  .chip .dot { width:8px; height:8px; border-radius:50%; }
  .chip .name { font-size:12px; margin-top:4px; color:var(--dim); }
  .chip .nums { font-size:11.5px; color:var(--dim); margin-top:2px; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>100 Hidden Frogs × Jev</h1>
  <div class="meta" id="meta"></div>
</header>
<main>
  <section id="viewer"><img id="shot" alt="кадр"></section>
  <aside>
    <div class="legend">
      <span><i style="background:var(--yellow)"></i>варианты Jev</span>
      <span><i style="background:var(--green)"></i>выбранный клик</span>
      <span><i style="background:var(--magenta)"></i>START</span>
    </div>
    <h2>Решение</h2>
    <div class="action" id="action"></div>
    <dl class="kv" id="kv"></dl>
    <h2>Варианты Jev</h2>
    <table id="candidates"><thead>
      <tr><th>тайл</th><th>present</th><th>conf</th><th>скор</th><th>бокс</th></tr>
    </thead><tbody></tbody></table>
  </aside>
</main>
<nav id="timeline"></nav>
<script>
const DATA = __DATA__;
const ACTION = { start: "START", click: "CLICK", scroll: "SCROLL" };
const COLOUR = { start: "var(--magenta)", click: "var(--green)", scroll: "var(--orange)" };
let current = 0;

document.getElementById("meta").innerHTML =
  `<b>${DATA.model}</b> · ${DATA.mode} · создано ${DATA.created} · ` +
  `вызовов <b>${DATA.calls}</b> · токенов <b>${DATA.tokens.toLocaleString("ru-RU")}</b> · ` +
  `≈ $<b>${DATA.cost_usd.toFixed(4)}</b>`;

function chip(step, index) {
  const el = document.createElement("button");
  el.className = "chip" + (index === current ? " active" : "");
  const frog = step.frog_p === undefined ? "—" : step.frog_p.toFixed(2);
  el.innerHTML =
    `<div class="top"><span>шаг ${index + 1}</span>` +
    `<span class="dot" style="background:${COLOUR[step.action]}"></span></div>` +
    `<div class="name">${ACTION[step.action]}</div>` +
    `<div class="nums">титул ${step.title_p.toFixed(2)} · лягушка ${frog}</div>`;
  el.onclick = () => select(index);
  return el;
}

function row(label, value) {
  return `<dt>${label}</dt><dd>${value}</dd>`;
}

function select(index) {
  current = index;
  const step = DATA.steps[index];
  document.getElementById("shot").src = step.image;
  const action = document.getElementById("action");
  action.textContent = ACTION[step.action];
  action.className = "action " + step.action;

  let kv = row("кадр", step.frame);
  kv += row("титульный экран", step.title_p.toFixed(3));
  if (step.frog_p !== undefined) kv += row("есть лягушка", step.frog_p.toFixed(3));
  if (step.green_px) kv += row("замазано зелёных", step.green_px + " px");
  if (step.grid) kv += row("сетка", step.grid.join(" × "));
  const box = step.box_px || step.start_box;
  if (box) {
    const cx = Math.round((box[0] + box[2]) / 2), cy = Math.round((box[1] + box[3]) / 2);
    kv += row("бокс", box.join(", "));
    kv += row("точка клика", `${cx}, ${cy}`);
  }
  if (step.score !== undefined) kv += row("скор лучшего", step.score.toFixed(3));
  kv += row("вызовов", step.calls);
  kv += row("токенов", step.tokens.toLocaleString("ru-RU"));
  kv += row("время", step.elapsed_ms + " ms");
  document.getElementById("kv").innerHTML = kv;

  const tbody = document.querySelector("#candidates tbody");
  tbody.innerHTML = "";
  (step.candidates || []).forEach((candidate, i) => {
    const tr = document.createElement("tr");
    if (i === 0) tr.className = "best";
    tr.innerHTML = `<td>${candidate.tile}</td><td>${candidate.present.toFixed(2)}</td>` +
      `<td>${candidate.confidence === null ? "—" : candidate.confidence.toFixed(2)}</td>` +
      `<td>${candidate.score.toFixed(3)}</td><td>${candidate.box_px.join(", ")}</td>`;
    tbody.appendChild(tr);
  });

  document.querySelectorAll(".chip").forEach((el, i) => el.classList.toggle("active", i === current));
}

const timeline = document.getElementById("timeline");
DATA.steps.forEach((step, index) => timeline.appendChild(chip(step, index)));
document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight") select(Math.min(current + 1, DATA.steps.length - 1));
  if (event.key === "ArrowLeft") select(Math.max(current - 1, 0));
});
if (DATA.live) {
  const meta = document.createElement("meta");
  meta.httpEquiv = "refresh";
  meta.content = "4";
  document.head.appendChild(meta);
}
const wanted = parseInt(location.hash.replace("#", ""), 10);
select(Number.isFinite(wanted) && wanted >= 1 && wanted <= DATA.steps.length ? wanted - 1 : 0);
</script>
</body>
</html>
