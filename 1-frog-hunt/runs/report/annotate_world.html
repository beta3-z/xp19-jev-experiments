<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Разметка на панораме</title>
<style>
  :root { --bg:#14161a; --ink:#e8ecf1; --dim:#93a1b1; --green:#00be5a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13.5px/1.45 "Segoe UI",sans-serif; }
  header { padding:10px 18px; border-bottom:1px solid #2a2f36; display:flex; gap:18px;
           align-items:center; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:5; }
  .hint { color:var(--dim); font-size:12.5px; }
  #stage { padding:12px 18px 80px; }
  #wrap { position:relative; display:inline-block; line-height:0; }
  #shot { display:block; width:1280px; }
  #layer { position:absolute; left:0; top:0; right:0; bottom:0; cursor:crosshair; }
  .box { position:absolute; border:2px solid var(--green); background:rgba(0,190,90,.10); cursor:pointer; }
  .box span { position:absolute; left:0; top:-15px; font-size:11px; color:var(--green);
              background:rgba(0,0,0,.6); padding:0 3px; pointer-events:none; }
  .handle { position:absolute; width:13px; height:13px; background:var(--green);
            border:1px solid rgba(0,0,0,.6); border-radius:2px; }
  .handle.nw { left:-7px; top:-7px; cursor:nwse-resize; }
  .handle.ne { right:-7px; top:-7px; cursor:nesw-resize; }
  .handle.sw { left:-7px; bottom:-7px; cursor:nesw-resize; }
  .handle.se { right:-7px; bottom:-7px; cursor:nwse-resize; }
  nav { position:fixed; bottom:0; left:0; right:0; background:#191c21; border-top:1px solid #2a2f36;
        padding:10px 18px; display:flex; gap:10px; align-items:center; }
  button { background:#232a31; color:var(--ink); border:1px solid #3b434d; border-radius:7px;
           padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover { border-color:#6d7885; }
  #status { color:var(--dim); font-size:12.5px; }
</style>
</head>
<body>
<header>
  <b>Разметка на панораме</b>
  <span class="hint">клик по пустому месту — добавить рамку; клик по рамке — удалить;
    угловые квадратики — изменить размер</span>
  <span id="status"></span>
</header>
<div id="stage">
  <div id="wrap">
    <img id="shot" alt="">
    <div id="layer"></div>
  </div>
</div>
<nav>
  <button id="save">сохранить разметку</button>
  <button id="reload">перечитать с диска</button>
  <span class="hint" id="counts"></span>
</nav>
<script>
const NEW_BOX = 90;
let state = { width: 0, height: 0, boxes: [] };
let drag = null;

function render() {
  const img = document.getElementById("shot");
  const layer = document.getElementById("layer");
  const scale = img.clientWidth / state.width;
  layer.innerHTML = "";
  state.boxes.forEach((box, index) => {
    const [x0, y0, x1, y1] = box;
    const el = document.createElement("div");
    el.className = "box";
    el.style.cssText = `left:${x0 * scale}px;top:${y0 * scale}px;` +
      `width:${(x1 - x0) * scale}px;height:${(y1 - y0) * scale}px`;
    el.innerHTML = `<span>#${index + 1}</span>`;
    el.onclick = event => {
      event.stopPropagation();
      state.boxes.splice(index, 1);
      render();
    };
    ["nw", "ne", "sw", "se"].forEach(corner => {
      const handle = document.createElement("div");
      handle.className = `handle ${corner}`;
      handle.onmousedown = event => startResize(event, index, corner);
      handle.onclick = event => event.stopPropagation();
      el.appendChild(handle);
    });
    layer.appendChild(el);
  });
  document.getElementById("counts").textContent = `рамок ${state.boxes.length}`;
}

function startResize(event, index, corner) {
  event.stopPropagation();
  event.preventDefault();
  const scale = document.getElementById("shot").clientWidth / state.width;
  drag = { index, corner, scale, x: event.clientX, y: event.clientY, box: state.boxes[index].slice() };
  document.addEventListener("mousemove", onResize);
  document.addEventListener("mouseup", stopResize);
}

function onResize(event) {
  if (!drag) return;
  const dx = (event.clientX - drag.x) / drag.scale;
  const dy = (event.clientY - drag.y) / drag.scale;
  let [x0, y0, x1, y1] = drag.box;
  if (drag.corner.includes("w")) x0 += dx;
  if (drag.corner.includes("e")) x1 += dx;
  if (drag.corner.includes("n")) y0 += dy;
  if (drag.corner.includes("s")) y1 += dy;
  if (x1 - x0 < 20) { drag.corner.includes("w") ? x0 = x1 - 20 : x1 = x0 + 20; }
  if (y1 - y0 < 20) { drag.corner.includes("n") ? y0 = y1 - 20 : y1 = y0 + 20; }
  state.boxes[drag.index] = [Math.round(Math.max(0, x0)), Math.round(Math.max(0, y0)),
                             Math.round(Math.min(state.width, x1)), Math.round(Math.min(state.height, y1))];
  render();
}

function stopResize() {
  drag = null;
  document.removeEventListener("mousemove", onResize);
  document.removeEventListener("mouseup", stopResize);
}

document.getElementById("layer").onclick = event => {
  const layer = document.getElementById("layer");
  const rect = layer.getBoundingClientRect();
  const scale = document.getElementById("shot").clientWidth / state.width;
  const cx = (event.clientX - rect.left) / scale;
  const cy = (event.clientY - rect.top) / scale;
  const half = NEW_BOX / 2;
  state.boxes.push([Math.round(cx - half), Math.round(cy - half),
                    Math.round(cx + half), Math.round(cy + half)]);
  render();
};

document.getElementById("save").onclick = async () => {
  const response = await fetch("/world_annotations", { method: "POST", body: JSON.stringify(state.boxes) });
  document.getElementById("status").textContent = response.ok ? "сохранено" : "ошибка сохранения";
};

document.getElementById("reload").onclick = () => boot();

async function boot() {
  const world = await (await fetch("/world.json")).json();
  state.width = world.width;
  state.height = world.height;
  const img = document.getElementById("shot");
  img.src = world.image + "?t=" + Date.now();
  img.onload = render;
  let saved = null;
  try { saved = await (await fetch("/world_annotations")).json(); } catch (error) { saved = null; }
  state.boxes = (Array.isArray(saved) && saved.length ? saved : world.boxes).map(box => box.slice());
  document.getElementById("status").textContent =
    Array.isArray(saved) && saved.length ? "загружена ваша версия" : "загружены исходные рамки";
  if (img.complete) render();
}

boot();
</script>
</body>
</html>
